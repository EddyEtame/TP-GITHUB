name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun secret suivi
        run: |
          if git ls-files | grep -E '\.env$'; then
            echo "Un fichier .env est suivi par Git : retirez-le."
            exit 1
          fi
      - name: Titre present
        run: grep -q "<title>.\+</title>" site/index.html
      - name: Conf nginx valide
        run: |
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
